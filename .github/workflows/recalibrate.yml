name: Recalibrate vs Polymarket

on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~3:17 AM Central
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill resolved Polymarket 5m BTC markets + Coinbase candles
        run: node tools/backfill.mjs 4
      - name: Replay tuner
        run: node tools/tune.mjs
      - name: Commit new parameters and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add params.json data/calibration.json data/edge.json
          git diff --cached --quiet || git commit -m "Nightly recalibration vs Polymarket"
          git push
