name: Recalibrate vs Polymarket

on:
  schedule:
    # Twice a day: ~3:17 AM and ~3:17 PM Central (cron is UTC; Central is UTC-6 in winter, UTC-5 in summer)
    - cron: "17 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recalibrate
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill resolved Polymarket 5m BTC markets + Coinbase candles
        run: node tools/backfill.mjs 4
      - name: Replay tuner
        run: node tools/tune.mjs
      - name: Commit new parameters and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add params.json data/calibration.json data/edge.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Recalibration vs Polymarket ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin main
          git push origin HEAD:main
